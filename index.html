<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wrapper">

    <div class="error-message message">Please enter a task!</div>
    <div class="added-message message">Task added!</div>

    <button class="theme-button">
      <img src="img/theme-btn-img.png" alt="">
    </button>

    <div class="container">
      <div class="container-title">Todo list</div>
      <div class="container-input-block">
        <input type="text" class="input" id="input">
        <button class="button-add" id="add-btn">Add</button>
      </div>

      <div class="container-list" id="list">
        
      </div>

    </div>
  </div>



  <script src="app.js"></script>
</body>
</html>
